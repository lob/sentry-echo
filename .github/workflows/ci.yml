name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Test, Lint, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      # golangci-lint v1.64.8 is built with go1.24 and refuses a go 1.25 target,
      # so the v6 action cannot lint this module. v2 is the first line built with go1.25+.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Build
        run: go build ./...
